# Starship Prompt Configuration
# Theme: Catppuccin Frappe Powerline
# https://github.com/catppuccin/starship

palette = 'catppuccin_frappe'

format = """
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](bg:green fg:yellow)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](bg:sapphire fg:green)\
$docker_context\
$conda\
[](bg:lavender fg:sapphire)\
$time\
[ ](fg:lavender)\
$line_break$character"""

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user ]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow fg:crust"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:yellow fg:crust"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "bg:green fg:crust"
format = '[ $symbol ($version) ]($style)'

[c]
symbol = " "
style = "bg:green fg:crust"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = "󱘗"
style = "bg:green fg:crust"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:green fg:crust"
format = '[ $symbol ($version) ]($style)'

[php]
symbol = ""
style = "bg:green fg:crust"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = ""
style = "bg:green fg:crust"
format = '[ $symbol ($version) ]($style)'

[kotlin]
symbol = ""
style = "bg:green fg:crust"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = ""
style = "bg:green fg:crust"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:green fg:crust"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = ""
style = "bg:sapphire fg:crust"
format = '[ $symbol $context ]($style)'

[conda]
style = "bg:sapphire fg:crust"
format = '[ $symbol $environment ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:lavender fg:crust"
format = '[  $time ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:lavender)'
vimcmd_replace_symbol = '[](bold fg:lavender)'
vimcmd_visual_symbol = '[](bold fg:yellow)'

[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
overlay2 = "#949cbb"
overlay1 = "#838ba7"
overlay0 = "#737994"
surface2 = "#626880"
surface1 = "#51576d"
surface0 = "#414559"
base = "#303446"
mantle = "#292c3c"
crust = "#232634"
